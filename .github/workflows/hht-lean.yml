name: HHT Lean certificate slices

on:
  pull_request:
    paths:
      - 'fixtures/lean-proof/HHTCertificates.lean'
      - 'fixtures/lean-proof/HHT_LEAN.md'
      - 'scripts/check_hht_lean.py'
      - '.github/workflows/hht-lean.yml'
  push:
    branches: ['research/xi-strip-lean']

permissions:
  contents: read

concurrency:
  group: hht-lean-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kernel-slices:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install the same fixed Lean toolchain as the existing fixture
        run: |
          timeout 300s curl --connect-timeout 15 --max-time 240 --proto '=https' --tlsv1.2 -sSf -o /tmp/elan-init.sh https://raw.githubusercontent.com/leanprover/elan/464c9d28395000a2a0128e07081e4956d50eced2/elan-init.sh
          echo 'a620ff1641616222c8d37c54845492004bb84d6877cdbc944dd65c1aa685bf53  /tmp/elan-init.sh' | sha256sum --check --strict
          timeout 600s sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          timeout 900s "$HOME/.elan/bin/elan" toolchain install leanprover/lean4:v4.33.0
      - name: Restore locked Mathlib cache
        working-directory: fixtures/lean-proof
        run: timeout 900s lake exe cache get
      - name: Compile and audit the exact theorem slices
        run: timeout 300s python3 scripts/check_hht_lean.py
