name: HHT localization and exact threshold

on:
  pull_request:
    paths:
      - 'fixtures/lean-proof/HHTLocalization.lean'
      - 'fixtures/HHT_LOCALIZATION.md'
      - 'fixtures/hankel_localization.py'
      - 'scripts/check_hht_localization.py'
      - 'scripts/certify_localization_blindspot.py'
      - 'scripts/certify_hankel_threshold.py'
      - 'scripts/test_hankel_localization.py'
      - 'scripts/test_localization_intervals.py'
      - 'scripts/test_hankel_threshold.py'
      - '.github/workflows/hht-localization.yml'
  push:
    branches: ['research/hankel-localization-gap']

permissions:
  contents: read

concurrency:
  group: hht-localization-${{ github.ref }}
  cancel-in-progress: true

jobs:
  complete-spectrum-certificates:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Run all exact-arithmetic and rejection tests
        run: |
          (ulimit -v 524288; ulimit -t 20; ulimit -f 256; timeout 30s python3 scripts/test_hankel_localization.py)
          (ulimit -v 524288; ulimit -t 20; ulimit -f 256; timeout 30s python3 scripts/test_localization_intervals.py)
          (ulimit -v 524288; ulimit -t 30; ulimit -f 256; timeout 45s python3 scripts/test_hankel_threshold.py)
      - name: Certify complete moments and the frozen degree-fifteen witness
        run: |
          ulimit -v 524288
          ulimit -t 30
          ulimit -f 512
          timeout 45s python3 scripts/certify_hankel_threshold.py
  localization-kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install the existing locked Lean toolchain
        run: |
          timeout 300s curl --connect-timeout 15 --max-time 240 --proto '=https' --tlsv1.2 -sSf -o /tmp/elan-init.sh https://raw.githubusercontent.com/leanprover/elan/464c9d28395000a2a0128e07081e4956d50eced2/elan-init.sh
          echo 'a620ff1641616222c8d37c54845492004bb84d6877cdbc944dd65c1aa685bf53  /tmp/elan-init.sh' | sha256sum --check --strict
          timeout 600s sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          timeout 900s "$HOME/.elan/bin/elan" toolchain install leanprover/lean4:v4.33.0
      - name: Restore the existing fixed Mathlib manifest
        working-directory: fixtures/lean-proof
        run: timeout 900s lake exe cache get
      - name: Compile and audit without weakening policy
        run: timeout 300s python3 scripts/check_hht_localization.py
